[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ConvNeXts"
version = "0.1.0"
description = "ConvNeXt experiment"
requires-python = ">=3.10, <=3.13"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torchvision (<0.29)",
]

[tool.setuptools.packages.find]
where = ["src"]
