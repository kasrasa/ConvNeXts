[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ConvNeXts"
version = "0.1.0"
description = "ConvNeXt experiment"
requires-python = ">=3.11, <=3.13"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torchvision (<0.29)",
  "scikit-learn (>=1.9.1,<2.0.0)"
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
